<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Circular Badge -->
  <circle cx="50" cy="50" r="49" fill="#0b0f19" />
  
  <!-- Outer Phone Casing -->
  <rect x="28" y="16" width="44" height="68" rx="8" ry="8" fill="#0b0f19" stroke="#ffffff" stroke-width="2.6" />
  
  <!-- Screen Bezel Inset -->
  <rect x="31" y="21" width="38" height="58" rx="5" ry="5" fill="#111827" stroke="#ffffff" stroke-width="0.75" opacity="0.9" />

  <!-- Camera / Dynamic Island Notch -->
  <rect x="42" y="18" width="16" height="3" rx="1.5" fill="#ffffff" />
  <circle cx="36" cy="19.5" r="1.2" fill="#ffffff" />

  <!-- Botanical / Floral Motif on Phone Screen/Back -->
  <!-- Top Left Flower -->
  <g transform="translate(41, 35) scale(0.7)">
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    <circle cx="0" cy="-6" r="3" fill="#ffffff" />
    <circle cx="5.7" cy="-2" r="3" fill="#ffffff" />
    <circle cx="3.5" cy="5" r="3" fill="#ffffff" />
    <circle cx="-3.5" cy="5" r="3" fill="#ffffff" />
    <circle cx="-5.7" cy="-2" r="3" fill="#ffffff" />
    <circle cx="0" cy="0" r="1.5" fill="#111827" />
  </g>

  <!-- Center Right Blossom -->
  <g transform="translate(58, 48) scale(0.6)">
    <circle cx="0" cy="-5" r="2.5" fill="#ffffff" />
    <circle cx="4.8" cy="-1.5" r="2.5" fill="#ffffff" />
    <circle cx="3" cy="4" r="2.5" fill="#ffffff" />
    <circle cx="-3" cy="4" r="2.5" fill="#ffffff" />
    <circle cx="-4.8" cy="-1.5" r="2.5" fill="#ffffff" />
    <circle cx="0" cy="0" r="1.2" fill="#111827" />
  </g>

  <!-- Bottom Left Flower -->
  <g transform="translate(40, 63) scale(0.8)">
    <circle cx="0" cy="-6" r="3.2" fill="#ffffff" />
    <circle cx="5.7" cy="-2" r="3.2" fill="#ffffff" />
    <circle cx="3.5" cy="5" r="3.2" fill="#ffffff" />
    <circle cx="-3.5" cy="5" r="3.2" fill="#ffffff" />
    <circle cx="-5.7" cy="-2" r="3.2" fill="#ffffff" />
    <circle cx="0" cy="0" r="1.8" fill="#111827" />
  </g>

  <!-- Foliage / Vines / Leaves -->
  <path d="M 46 40 Q 52 44 54 48" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <path d="M 43 55 Q 48 58 46 64" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <path d="M 50 32 Q 54 30 57 32" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round" />
  <circle cx="57" cy="32" r="1" fill="#ffffff" />
  <circle cx="52" cy="62" r="1" fill="#ffffff" />
  <circle cx="35" cy="47" r="0.9" fill="#ffffff" />
  <circle cx="61" cy="66" r="0.9" fill="#ffffff" />

  <!-- Subtle Phone Speaker / Home Bar -->
  <rect x="45" y="74" width="10" height="1.5" rx="0.75" fill="#ffffff" opacity="0.6" />
</svg>
